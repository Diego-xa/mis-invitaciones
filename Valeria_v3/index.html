<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎀 Valeria - Mi primer añito</title>
    <meta name="description" content="Una celebración muy especial: el primer añito de Valeria. 🎀">
    <!-- Vista previa para WhatsApp, Facebook y Messenger -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="🎀 Valeria - Mi primer añito">
    <meta property="og:description" content="Una celebración muy especial: el primer añito de Valeria. 🎀">
    <meta property="og:image" content="https://mis-invitaciones.diegoique66.workers.dev/Valeria_v2/img/verde.png">
    <meta property="og:url" content="https://mis-invitaciones.diegoique66.workers.dev/Valeria_v2/">
    <link rel="icon" type="image/png" href="img/icono.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="music-container">
        <button id="musicButton" class="music-button" aria-label="Reproducir música">
            <span class="play-icon"></span>
        </button>

        <audio id="music">
            <source src="musica.mp3/Christina Perri ~ You Are My Sunshine (lyrics).mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="galeria">

        <img src="img/parte1.png" alt="">
        <img src="img/parte2.png" alt="">
        <img src="img/parte2 (2).png" alt="">

        <div class="ultima-imagen">

            <img src="img/parte4.png" alt="">

            <a href="https://wa.link/gmsiq0" class="asistencia-button" target="_blank">
                <img src="img/boton_asistencia.png" alt="Confirmar asistencia">
            </a>

        </div>

    </div>

    <script>
        const music = document.getElementById("music");
        const musicButton = document.getElementById("musicButton");

        musicButton.addEventListener("click", () => {

            if (music.paused) {

                music.play();

                musicButton.classList.add("paused");
                musicButton.setAttribute("aria-label", "Pausar música");

            } else {

                music.pause();

                musicButton.classList.remove("paused");
                musicButton.setAttribute("aria-label", "Reproducir música");

            }
        });

        music.addEventListener("ended", () => {

            musicButton.classList.remove("paused");
            musicButton.setAttribute("aria-label", "Reproducir música");

        });
    </script>

</body>

</html>
